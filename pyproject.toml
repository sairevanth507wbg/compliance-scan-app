[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-scan"
version = "1.0.0"
description = "Posit Connect Git compliance job and admin dashboard (shared code)"
requires-python = ">=3.11"
dependencies = ["requests>=2.32.3", "psycopg[binary]>=3.2.10"]

[tool.setuptools]
packages = ["compliance"]
